name: Build Warm APK + AAB

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/warm/**'
      - '.github/workflows/build-warm-apk.yml'
    tags:
      - 'warm-v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        working-directory: artifacts/warm
        run: PORT=3000 BASE_PATH=/ pnpm build:cap

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 36
        run: sdkmanager "platforms;android-36" --sdk_root=$ANDROID_SDK_ROOT

      - name: Sync Capacitor
        working-directory: artifacts/warm
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > artifacts/warm/android/app/warm-release.jks

      - name: Build release APK + AAB
        working-directory: artifacts/warm/android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/artifacts/warm/android/app/warm-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload APK artifact (CI storage)
        uses: actions/upload-artifact@v4
        with:
          name: warm-release-apk
          path: artifacts/warm/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact (CI storage)
        uses: actions/upload-artifact@v4
        with:
          name: warm-release-aab
          path: artifacts/warm/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/warm-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Thermal Pad ${{ github.ref_name }}
          files: |
            artifacts/warm/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: false
          body: |
            APK directo para instalar en Android (habilitar "Instalar apps desconocidas").
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
