name: Generate Keystore (one-time)

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Keystore password'
        required: true
      key_alias:
        description: 'Key alias'
        required: true
        default: 'malvinas'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore malvinas-release.jks \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass  "${{ github.event.inputs.keystore_password }}" \
            -dname "CN=Malvinas App, OU=Mobile, O=GAB2026, L=Buenos Aires, ST=Buenos Aires, C=AR"
          base64 malvinas-release.jks > malvinas-release.jks.b64
          echo "=== BASE64 KEYSTORE ===" 
          cat malvinas-release.jks.b64

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: malvinas-keystore
          path: malvinas-release.jks.b64
          retention-days: 1
