name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/malvinas/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'malvinas-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        working-directory: artifacts/malvinas
        run: PORT=3000 BASE_PATH=/ pnpm build:cap

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 36
        run: sdkmanager "platforms;android-36" --sdk_root=$ANDROID_SDK_ROOT

      - name: Sync Capacitor
        working-directory: artifacts/malvinas
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > artifacts/malvinas/android/app/malvinas-release.jks

      - name: Build release APK + AAB
        working-directory: artifacts/malvinas/android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/artifacts/malvinas/android/app/malvinas-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload APK artifact (CI storage)
        uses: actions/upload-artifact@v4
        with:
          name: malvinas-release-apk
          path: artifacts/malvinas/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact (CI storage)
        uses: actions/upload-artifact@v4
        with:
          name: malvinas-release-aab
          path: artifacts/malvinas/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/malvinas-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Distancia a Malvinas ${{ github.ref_name }}
          files: |
            artifacts/malvinas/android/app/build/outputs/apk/release/app-release.apk
            artifacts/malvinas/android/app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: false
          body: |
            APK: instalación directa (habilitar "Instalar apps desconocidas").
            AAB: subir a Google Play Console.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
