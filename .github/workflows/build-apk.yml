name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/malvinas/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ───────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Node 22 ────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── pnpm ───────────────────────────────────────────────────
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Java 21 (capacitor-android source release 21) ──────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ── Android SDK setup (installs sdkmanager + cmdline-tools) ─
      - uses: android-actions/setup-android@v3

      # ── Install API 36 + build-tools ───────────────────────────
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools"

      # ── Build web app (base = /) ────────────────────────────────
      - name: Build web app for Capacitor
        working-directory: artifacts/malvinas
        env:
          BASE_PATH: /
          PORT: 3000
        run: pnpm build:cap

      # ── Sync Capacitor assets → android/ ───────────────────────
      - name: Capacitor sync
        working-directory: artifacts/malvinas
        run: npx cap sync android

      # ── Gradle assembleDebug ────────────────────────────────────
      - name: Build debug APK
        working-directory: artifacts/malvinas/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ── Upload APK ──────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: malvinas-debug
          path: artifacts/malvinas/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
