<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px;
  }
  .container { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 20px; }

  .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #666;
    padding: 0 4px;
  }

  /* 3-card row */
  .btn-row {
    display: flex;
    gap: 10px;
  }

  .btn-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 18px 8px;
    border-radius: 18px;
    border: 1px solid #2a2a2a;
    background: #161616;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-card.active {
    background: #1e1410;
    border-color: #c2410c;
    box-shadow: 0 0 18px rgba(194,65,12,0.25);
  }

  .btn-name {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #555;
  }
  .btn-card.active .btn-name { color: #fb923c; }

  .btn-mins {
    font-size: 26px;
    font-weight: 700;
    color: #333;
    line-height: 1;
  }
  .btn-card.active .btn-mins { color: #ffffff; }

  .btn-unit {
    font-size: 11px;
    font-weight: 500;
    color: #444;
    letter-spacing: 0.05em;
  }
  .btn-card.active .btn-unit { color: #fb923c; opacity: 0.8; }

  /* flame icon on HIGH */
  .flame { font-size: 16px; }

  /* calibrating state example */
  .calibrating {
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .cal-title {
    font-size: 13px;
    font-weight: 600;
    color: #ccc;
  }
  .cal-sub {
    font-size: 11px;
    color: #555;
  }
  .progress-track {
    height: 4px;
    background: #222;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 60%;
    background: linear-gradient(90deg, #c2410c, #f97316);
    border-radius: 999px;
  }
</style>
</head>
<body>
<div class="container">

  <!-- Calibrating state -->
  <div class="calibrating">
    <div class="cal-title">🌡 Chequeando temperatura máxima para tu dispositivo...</div>
    <div class="progress-track"><div class="progress-fill"></div></div>
    <div class="cal-sub">Esto solo ocurre una vez · No toques el teléfono</div>
  </div>

  <!-- Post-calibration buttons -->
  <div class="label">Intensidad</div>
  <div class="btn-row">

    <div class="btn-card">
      <span class="btn-name">Baja</span>
      <span class="btn-mins">16</span>
      <span class="btn-unit">min</span>
    </div>

    <div class="btn-card">
      <span class="btn-name">Media</span>
      <span class="btn-mins">8</span>
      <span class="btn-unit">min</span>
    </div>

    <div class="btn-card active">
      <span class="btn-name">🔥 Alta</span>
      <span class="btn-mins">4</span>
      <span class="btn-unit">min</span>
    </div>

  </div>

</div>
</body>
</html>
